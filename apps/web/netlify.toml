# One Netlify site for this repo. Paths are relative to the repository root.
# In the Netlify UI, leave the base directory empty and set the package directory to apps/web.
# Clear any UI publish directory so this file's publish path is used.

[build]
command = "pnpm build"
# Repo-root path. This is the Next.js build the runtime must publish.
publish = "apps/web/.next"

[build.environment]
NODE_VERSION = "20"
PNPM_FLAGS = "--shamefully-hoist"
# Demo guards. The function clears the same switches again at runtime.
AI_CHAT_ENABLED = "false"
PAYMENTS_TEST_MODE = "false"
PAYMENTS_MOCK_MODE = "false"

# Explicit runtime. Automatic detection published this site without an SSR handler.
[[plugins]]
package = "@netlify/plugin-nextjs"

[functions]
# Produced by @brand/bff build. One prebundled file, no workspace TypeScript imports.
directory = "apps/bff/dist/netlify"
